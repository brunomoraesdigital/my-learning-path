<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning Path</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="conteudo" id="conteudo">
      <header class="cabecalho">
        <div class="ld-esquerdo">
          <div class="logo">BM</div>
          <span>::</span>
          <h1>
            <!-- My Learning Path -->
            Meu Plano de Estudos
          </h1>
        </div>
        <div class="ld-direito">
        <button class="bt-icon icon-config" aria-label="Configurações"></button>
        <button class="bt-icon icon-perfil" aria-label="Perfil"></button>
        </div>
      </header>
      <main class="principal">
        <!-- corpo -->
      </main>
    <footer class="rodape">
      <button class="bt">
        <div class="caixa-icon">
          <i class="icon icon-salvar"></i>
        </div> 
        <div class="caixa-txt">
          <span>Salvar</span>
        </div>
      </button>
      <button class="bt">
        <div class="caixa-icon">
          <i class="icon icon-download"></i>
        </div> 
        <div class="caixa-txt">
          guardar
        </div>
      </button>
      <button class="bt">       
      <div class="caixa-icon">
          <i class="icon icon-upload"></i>
        </div>
        <div class="caixa-txt">
          carregar
        </div>
      </button>
    </footer>
    </div>
